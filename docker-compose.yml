version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  web:
    build: .
    container_name: repograph
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH=repograph
      # Optional: pass your Gemini API key here
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb_data:

